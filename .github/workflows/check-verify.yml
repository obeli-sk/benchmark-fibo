name: check-verify
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xe {0}

jobs:
  verify:
    name: verify (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rs, go, py, js, js-native, rs-spawn, kt]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=
      - name: Populate the nix store
        run: |
          nix develop --command echo

      - name: Build WASM components
        run: nix develop --command just build-${{ matrix.language }}

      - name: Build Rust workflow (Kotlin deployment reuses it)
        if: matrix.language == 'kt'
        run: nix develop --command just build-rs

      - name: Verify config
        run: |
          server_config=()
          if [[ "${{ matrix.language }}" == "rs-spawn" ]]; then
              server_config=(--server-config server-spawn.toml)
          fi
          nix develop --command obelisk deployment verify \
            --allow-unavailable-runtime-config \
            "${server_config[@]}" \
            --deployment obelisk-${{ matrix.language }}.toml
